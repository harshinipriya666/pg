# =============================================================
# PG MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# All secrets are injected via environment variables.
# Local dev: set SPRING_DATASOURCE_* in your local .env
# Production (Render): set these in the Environment tab
# =============================================================

# --- Database ---
# For Aiven MySQL, the full JDBC URL from Aiven console already includes SSL params.
# Example Aiven URL:
#   jdbc:mysql://mysql-xxx.aivencloud.com:PORT/defaultdb?ssl-mode=REQUIRED
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pg_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (important for cloud DBs with idle timeouts)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=60000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Dialect is auto-detected by Hibernate 6+ — do not set explicitly (HHH90000025)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Server ---
# Render injects PORT env var; fallback to 8080 for local dev
server.port=${PORT:8080}

# --- CORS Allowed Origin ---
# Set FRONTEND_URL on Render to your exact Vercel URL (no trailing slash)
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# --- AI Configuration (Google Gemini) ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.timeout.seconds=30