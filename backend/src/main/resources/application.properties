# =============================================================
# PG MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# All secrets are injected via environment variables.
# =============================================================

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pg_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
# Render injects PORT env var; fallback to 8080 for local dev
server.port=${PORT:8080}

# --- CORS Allowed Origin ---
# Set FRONTEND_URL on Render to your Vercel URL
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# --- AI Configuration (Google Gemini) ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.timeout.seconds=30